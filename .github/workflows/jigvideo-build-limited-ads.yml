name: "[JigVideo] Build stable Limited Ads backport"

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch or tag to build"
        required: true
        default: "codex/limited-ads-v4.3.1"
      godot_version:
        description: "Godot version"
        required: true
        default: "4.6.3"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Build Android plugin
        working-directory: platforms/android
        run: |
          chmod +x ./gradlew
          ./gradlew build -PgodotVersion="${{ inputs.godot_version }}"
          ./gradlew zipPlugins -PgodotVersion="${{ inputs.godot_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: jigvideo-admob-android-${{ inputs.godot_version }}
          path: platforms/android/.output/poing-godot-admob-android-v${{ inputs.godot_version }}.zip

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install scons
      - name: Build iOS plugin
        working-directory: platforms/ios
        run: ./scripts/build.sh "${{ inputs.godot_version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: jigvideo-admob-ios-${{ inputs.godot_version }}
          path: platforms/ios/bin/release/*.zip
